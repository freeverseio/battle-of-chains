version: 2.1

orbs:
  kube-orb: circleci/kubernetes@1.3.1
  helm: circleci/helm@3.0.2

commands:

  dockerize-and-push:
    parameters:
      image:
        type: string
      folder:
        type: string
    steps:
      - attach_workspace:
          at: ./
      - run:
          name: Docker login
          command: echo $DOCKER_PASSWD | docker login -u $DOCKER_ID --password-stdin
      - run:
          name: Build and push Docker image
          command: |
            cd << parameters.folder >>
            echo "Docker images for $CIRCLE_SHA1 will be pushed"
            docker build -t << parameters.image >>:$CIRCLE_SHA1 .
            docker push << parameters.image >>:$CIRCLE_SHA1
jobs:
  api-test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Run boc-api tests
          command: |
            echo "Running boc-api tests"

  build-app:
    parameters:
      image:
        type: string
      folder:
        type: string
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
          version: edge
      - dockerize-and-push:
          image: << parameters.image >>
          folder: << parameters.folder >>

  trigger-deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Trigger deploy
          command: |
            echo "Triggering deploy"
            curl --location --request POST "https://circleci.com/api/v2/project/github/freeverseio/${BOC_INFRA}/pipeline" \
            --header "Content-Type: application/json" \
            -u "${API_TOKEN}:" \
            --data "{
              \"parameters\": {
                \"imageTag\": \"${CIRCLE_SHA1}\"
              }
            }"

workflows:
  ci-workflow:
    jobs:
      - api-test:
          name: api-test
      - build-app:
          name: build-indexer
          folder: boc-indexer
          image: freeverseio/boc-indexer
          context: dockerhub
          filters:
            branches:
              only:
                - main     
      - build-app:
          name: build-ui
          folder: boc-ui
          image: freeverseio/battle-of-chains-ui
          context: dockerhub
          filters:
            branches:
              only:
                - main     
      - build-app:
          name: build-api
          folder: boc-game-engine-api
          image: freeverseio/boc-api
          context: dockerhub
          filters:
            branches:
              only:
                - main 
      - build-app:
          name: build-postgraphile
          folder: boc-game-engine-postgraphile
          image: freeverseio/boc-postgraphile
          context: dockerhub
          filters:
            branches:
              only:
                - main   
      - trigger-deploy:
          name: trigger-deploy
          requires:
            - build-api
            - build-postgraphile
            - build-ui
            - build-indexer
          filters:
            branches:
              only:
                - main
